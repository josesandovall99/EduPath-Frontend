
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Wireframes para Aplicación Educativa</title>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
      <style>
        /* Quill editor professional styling */
        .ql-container { font-size: 14px; font-family: Arial, sans-serif; }
        .ql-editor { min-height: 300px; padding: 16px; line-height: 1.6; }
        .ql-toolbar { border: 1px solid #e0e0e0; border-bottom: 2px solid #e0e0e0; background-color: #f9f9f9; padding: 8px; }
        
        /* ===== TOOLBAR CENTRADA SIMETRICAMENTE - SOLUCIÓN FINAL ===== */
        
        /* Reset y configuración base de la toolbar */
        .ql-toolbar {
          z-index: 10;
          padding: 8px 8px;
          border: 1px solid #e0e0e0;
          border-bottom: 2px solid #e0e0e0;
          background-color: #f9f9f9;
          display: flex;
          flex-wrap: wrap;
          gap: 0;
          align-items: center;
          justify-content: flex-start;
          min-height: 48px;
          box-sizing: border-box;
        }
        
        /* Grupos de botones con alineación vertical perfecta */
        .ql-toolbar .ql-formats {
          margin: 0;
          padding: 0;
          display: inline-flex;
          gap: 2px;
          align-items: center;
          justify-content: center;
          vertical-align: middle;
          flex-wrap: nowrap;
          height: 28px;
          box-sizing: border-box;
        }
        
        .ql-toolbar .ql-formats:not(:last-child) {
          border-right: 1px solid #e0e0e0;
          padding: 0 8px;
          margin: 0 8px;
        }
        
        /* ===== CENTRADO UNIVERSAL - TODOS LOS BOTONES ===== */
        .ql-toolbar button {
          width: 28px !important;
          height: 28px !important;
          min-width: 28px !important;
          min-height: 28px !important;
          max-width: 28px !important;
          max-height: 28px !important;
          padding: 0 !important;
          margin: 0 !important;
          border: none !important;
          background: transparent !important;
          cursor: pointer;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
          border-radius: 3px;
          transition: background-color 0.2s ease, color 0.2s ease;
          flex-shrink: 0;
          line-height: 1;
          font-size: 0;
          position: relative;
          overflow: hidden;
          vertical-align: middle;
          box-sizing: border-box;
        }
        
        /* Estados de hover y active */
        .ql-toolbar button:hover {
          background-color: #f0f0f0;
        }
        
        .ql-toolbar button.ql-active {
          background-color: #e8f5e9;
          color: #2e7d32;
        }
        
        /* ===== BOTONES DE COLOR Y ALINEACIÓN - CENTRADO ESPECÍFICO ===== */
        .ql-toolbar button.ql-color,
        .ql-toolbar button.ql-background,
        .ql-toolbar button.ql-align,
        .ql-toolbar .ql-color button,
        .ql-toolbar .ql-background button,
        .ql-toolbar .ql-align button {
          width: 28px !important;
          height: 28px !important;
          padding: 0 !important;
          margin: 0 !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
          position: relative;
          box-sizing: border-box;
        }
        
        /* ===== RESET TOTAL DE SVG - EVITAR ESTILOS GLOBALES ===== */
        .ql-toolbar svg,
        .ql-toolbar button svg {
          width: 18px !important;
          height: 18px !important;
          max-width: 18px !important;
          max-height: 18px !important;
          min-width: 18px !important;
          min-height: 18px !important;
          stroke-width: 2 !important;
          flex-shrink: 0;
          display: block !important;
          margin: 0 auto !important;
          padding: 0 !important;
          border: none !important;
          background: transparent !important;
          vertical-align: middle;
          line-height: 1;
        }
        
        /* ===== SELECTORES DE COLOR CON BARRA CENTRADA ===== */
        .ql-toolbar .ql-color,
        .ql-toolbar .ql-background {
          width: 28px !important;
          height: 28px !important;
        }
        
        .ql-toolbar button.ql-color::after,
        .ql-toolbar button.ql-background::after {
          content: '';
          position: absolute;
          bottom: 2px;
          left: 50%;
          transform: translateX(-50%);
          width: 12px;
          height: 2px;
          background: currentColor;
          border-radius: 1px;
        }
        
        .ql-toolbar .ql-color-label,
        .ql-toolbar .ql-background-label,
        .ql-toolbar .ql-color .ql-picker-label,
        .ql-toolbar .ql-background .ql-picker-label {
          width: 28px !important;
          height: 28px !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
          padding: 0 !important;
          margin: 0 !important;
          box-sizing: border-box;
        }
        
        /* ===== BOTONES DE ALINEACIÓN - ANCHO FIJO ===== */
        .ql-toolbar button[value="left"],
        .ql-toolbar button[value="center"],
        .ql-toolbar button[value="right"],
        .ql-toolbar button[value="justify"] {
          width: 28px !important;
          height: 28px !important;
        }
        
        .ql-toolbar button[value="left"]::before,
        .ql-toolbar button[value="center"]::before,
        .ql-toolbar button[value="right"]::before,
        .ql-toolbar button[value="justify"]::before {
          font-size: 16px !important;
          line-height: 28px;
          font-family: serif;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
          width: 100%;
          height: 100%;
          margin: 0 !important;
          padding: 0 !important;
        }
        
        /* ===== BOTONES DE LISTA ===== */
        .ql-toolbar button[value="ordered"],
        .ql-toolbar button[value="bullet"] {
          width: 28px !important;
          height: 28px !important;
        }
        
        .ql-toolbar button[value="ordered"]::before,
        .ql-toolbar button[value="bullet"]::before {
          font-size: 14px !important;
          line-height: 28px;
          font-family: serif;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
          width: 100%;
          height: 100%;
          margin: 0 !important;
          padding: 0 !important;
        }
        
        /* ===== DROPDOWNS (PICKERS) - CENTRADO TOTAL ===== */
        .ql-toolbar .ql-picker {
          width: auto !important;
          height: 28px !important;
          line-height: 28px !important;
          padding: 0 6px !important;
          margin: 0 !important;
          border: 1px solid #d0d0d0 !important;
          border-radius: 3px;
          background: #fff !important;
          display: inline-flex !important;
          align-items: center !important;
          justify-content: center !important;
          vertical-align: middle;
          flex-shrink: 0;
          font-size: 13px;
          min-height: 28px;
          box-sizing: border-box;
        }
        
        .ql-toolbar .ql-picker-label {
          padding: 0 4px !important;
          margin: 0 !important;
          color: #333;
          font-size: 13px;
          font-weight: 500;
          line-height: 28px;
          display: inline-flex !important;
          align-items: center !important;
          justify-content: center !important;
          vertical-align: middle;
          white-space: nowrap;
          box-sizing: border-box;
        }
        
        .ql-toolbar .ql-picker-label::after {
          content: '▼';
          font-size: 8px;
          margin-left: 4px;
          opacity: 0.5;
          display: inline-block;
          vertical-align: middle;
          line-height: 1;
        }
        
        .ql-toolbar .ql-picker-options {
          padding: 4px 0 !important;
          border: 1px solid #d0d0d0 !important;
          border-radius: 3px;
          background: #fff;
          box-shadow: 0 2px 8px rgba(0,0,0,0.1);
          z-index: 20;
          margin: 0 !important;
        }
        
        .ql-toolbar .ql-picker-item {
          padding: 4px 10px !important;
          margin: 0 !important;
          line-height: 20px;
          font-size: 13px;
          color: #333;
          cursor: pointer;
        }
        
        .ql-toolbar .ql-picker-item.ql-selected {
          background-color: #e8f5e9;
          color: #2e7d32;
        }
        
        .ql-toolbar .ql-picker-item:hover {
          background-color: #f5f5f5;
        }
        
        /* Ancho específico para dropdowns */
        .ql-toolbar .ql-picker.ql-font {
          min-width: 120px !important;
        }
        
        .ql-toolbar .ql-picker.ql-size {
          min-width: 60px !important;
        }
        
        /* Font selector labels (show font names) */
        .ql-snow .ql-picker.ql-font .ql-picker-label::before { content: 'Arial'; }
        .ql-snow .ql-picker.ql-font .ql-picker-item[data-value='Arial']::before { content: 'Arial'; font-family: Arial, sans-serif; }
        .ql-snow .ql-picker.ql-font .ql-picker-item[data-value='Monospace']::before { content: 'Monospace'; font-family: 'Courier New', monospace; }
        .ql-snow .ql-picker.ql-font .ql-picker-item[data-value='Algerian']::before { content: 'Algerian'; font-family: 'Algerian', serif; }
        
        /* Size selector labels (show numbers only) */
        .ql-snow .ql-picker.ql-size .ql-picker-label::before { content: '14'; }
        .ql-snow .ql-picker.ql-size .ql-picker-item[data-value='10px']::before { content: '10'; }
        .ql-snow .ql-picker.ql-size .ql-picker-item[data-value='12px']::before { content: '12'; }
        .ql-snow .ql-picker.ql-size .ql-picker-item[data-value='14px']::before { content: '14'; }
        .ql-snow .ql-picker.ql-size .ql-picker-item[data-value='16px']::before { content: '16'; }
        .ql-snow .ql-picker.ql-size .ql-picker-item[data-value='18px']::before { content: '18'; }
        .ql-snow .ql-picker.ql-size .ql-picker-item[data-value='20px']::before { content: '20'; }
        .ql-snow .ql-picker.ql-size .ql-picker-item[data-value='24px']::before { content: '24'; }
        .ql-snow .ql-picker.ql-size .ql-picker-item[data-value='32px']::before { content: '32'; }
        .ql-snow .ql-picker.ql-size .ql-picker-option[data-value='32']::before { content: '32'; }
        
        /* Container styling */
        .quill-editor-container { border: 1px solid #d0d0d0; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .quill-editor-container .ql-snow { border: none; }
        .quill-editor-container .ql-toolbar { margin: 0; border: none; border-bottom: 1px solid #e0e0e0; }
        .quill-editor-container .ql-container { border: none; }
        
        /* Font families mapping */
        .ql-snow .ql-editor.ql-blank::before { color: #999; }
        .ql-snow .ql-editor .ql-font-arial { font-family: Arial, sans-serif; }
        .ql-snow .ql-editor .ql-font-monospace { font-family: 'Courier New', monospace; }
        .ql-snow .ql-editor .ql-font-algerian { font-family: 'Algerian', serif; }
      </style>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
